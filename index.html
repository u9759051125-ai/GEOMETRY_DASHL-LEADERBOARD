<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Ultimate HD List Hub</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #151820;
            --accent-color: #00f0ff;
            --accent-ill: #ff2a5f;
            --text-color: #ffffff;
            --text-muted: #8c92a4;
            --border-color: #232733;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

        header {
            text-align: center;
            padding: 25px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 25px;
        }
        header h1 { font-size: 2.4rem; color: var(--accent-color); text-transform: uppercase; letter-spacing: 3px; }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        nav button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        nav button:hover, nav button.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .list-container { display: none; max-width: 950px; margin: 0 auto; }
        .list-container.active { display: block; }

        .section-title {
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-left: 5px solid var(--accent-color);
            padding-left: 12px;
        }
        .ill-title { border-left-color: var(--accent-ill); }

        .demon-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .demon-card:hover {
            border-color: var(--accent-color);
            transform: translateX(4px);
        }

        .rank {
            font-size: 1.3rem;
            font-weight: bold;
            width: 85px;
            text-align: center;
            color: var(--accent-color);
            flex-shrink: 0;
        }
        .ill-rank { color: var(--accent-ill); }

        /* Miniature in stile livello GD reale (senza strisce da cantiere) */
        .level-thumbnail {
            width: 170px;
            height: 95px;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Stili visivi dedicati alle miniature dei livelli */
        .thumb-society { background: radial-gradient(circle, #00f0ff 0%, #051923 80%); box-shadow: inset 0 0 20px rgba(0,240,255,0.5); }
        .thumb-thinking { background: radial-gradient(circle, #7b2cbf 0%, #10002b 80%); box-shadow: inset 0 0 20px rgba(123,44,191,0.5); }
        .thumb-amethyst { background: radial-gradient(circle, #48cae4 0%, #03045e 80%); box-shadow: inset 0 0 20px rgba(72,202,228,0.5); }
        .thumb-flamewall { background: radial-gradient(circle, #ff3366 0%, #3a0ca3 80%); box-shadow: inset 0 0 20px rgba(255,51,102,0.5); }
        .thumb-tidal { background: radial-gradient(circle, #00b4d8 0%, #03045e 80%); box-shadow: inset 0 0 20px rgba(0,180,216,0.6); }
        .thumb-dark { background: radial-gradient(circle, #212529 0%, #000000 80%); border: 1px solid #343a40; }
        .thumb-yellow { background: radial-gradient(circle, #ffb703 0%, #370617 80%); box-shadow: inset 0 0 20px rgba(255,183,3,0.5); }
        .thumb-ill { background: radial-gradient(circle, #d90429 0%, #2b0d0f 80%); box-shadow: inset 0 0 25px rgba(217,4,41,0.7); }

        /* Icona centrale stilizzata per simulare l'anteprima del livello */
        .level-icon-badge {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 8px;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .demon-info { padding: 12px 18px; flex-grow: 1; }
        .demon-info h3 { font-size: 1.25rem; margin-bottom: 4px; }
        .demon-info p { color: var(--text-muted); font-size: 0.9rem; }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 22px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .player-left { display: flex; align-items: center; gap: 18px; }
        .player-avatar-box {
            width: 45px; height: 45px; border-radius: 50%;
            background-color: #1f2330; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--accent-color); border: 1px solid var(--accent-color);
            flex-shrink: 0; font-size: 0.95rem;
        }
        .player-points { font-weight: bold; color: var(--accent-color); font-size: 1.1rem; }
    </style>
</head>

        function showTab(tabId) {
            const containers = document.querySelectorAll('.list-container');
            containers.forEach(c => c.classList.remove('active'));

            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
